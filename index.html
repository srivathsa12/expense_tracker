<!DOCTYPE html>
<html>
    <head>
        <title> My Expense Tracker </title>

        <style>
            body{
                font-family: Arial;
                margin: 0;
            }

            #title{
                background-color: black;
                color: white;
                padding: 15px;
                margin: 0;
            }

            #sidebar{
                width: 250px;
                background-color: lightgray;
                padding: 20px;
                float: left;
                height: 100vh;
            }

            #main{
                margin-left: 300px;
                padding: 20px;
            }

        </style>
    </head>
    
    <body>

        <h1 id="title"> Expense Tracker</h1>
        <div id="sidebar">
            <h2>Add expense</h2>
            <p>Monthly budget (Rs)</p>
            <input type="number" id="budget">
            <p>What did you spend on ??</p>
            <input type="text" id="useName">

            <p>How much?</p>
            <input type="number" id="amount">

            <p> Category</p>
            <select id="category">
                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
                <option>Other</option>
            </select>

            <br><br>
            <button id="addBtn">Add</button>
        </div>
        <div id="main">
            <h2>This month</h2>
            <p>Total spent: Rs <span id="total">0</span></p>
            <p>Left: Rs<span id="left">0</span></p>
            <p id="warning"></p>
            <p>Food: Rs <span id="foodTotal">0</span></p>
            <p>Travel: Rs <span id="travelTotal">0</span></p>
            <p>Shopping: Rs<span id="shoppingTotal">0</span></p>
            <p>Others: Rs<span id="otherTotal">0</span></p>
            <ul id="list"></ul>
        </div>
        
        <script>
        var addBtn = document.getElementById("addBtn");
        var totalSpent = 0
        var food = 0
        var travel = 0
        var shopping = 0 
        var other = 0
        var expenses = [];

        function checkBudget(){
            var budget = Number(document.getElementById("budget").value);

            if (budget>0){
                var left = budget - totalSpent;
                document.getElementById("left").innerText = left;

                if (left<0){
                    document.getElementById("warning").innerText = "You are over budget!";
                }else if (totalSpent >= budget * 0.8){
                    document.getElementById("warning").innerText = "Careful! 80% of your budget is used"; 
                }else {
                    document.getElementById("warning").innerText = "";
                }
            }
        }

        function showExpense(name, amount, category){
            var item = document.createElement("li");
            item.innerText = name + "-Rs" + amount + "(" + category + ")";

            document.getElementById("list").appendChild(item);

            totalSpent = totalSpent + Number(amount);
            document.getElementById("total").innerText = totalSpent;

             
            
            if (category == "Food"){
                food = food + Number(amount);
                document.getElementById("foodTotal").innerText = food;
            } else if (category == "Travel"){
                travel = travel + Number(amount);
                document.getElementById("travelTotal").innerText = travel;
            }else if (category == "Shopping"){
                shopping = shopping + Number(amount);
                document.getElementById("shoppingTotal").innerText = shopping;
            }else {
                other = other + Number(amount);
                document.getElementById("otherTotal").innerText = other
            }
            checkBudget();     
        }      
            document.getElementById("budget").oninput = function(){
                localStorage.setItem("budget",document.getElementById("budget").value);
                checkBudget();
        };
        addBtn.onclick = function(){
            var name = document.getElementById("useName").value;
            var amount = document.getElementById("amount").value;
            var category = document.getElementById("category").value;

            if (name == "" || amount == ""){
                alert("Please fill everything");
                return;
            }
            showExpense(name, amount, category);
            
            expenses.push({name:name, amount:amount,category:category});
            localStorage.setItem("expenses", JSON.stringify(expenses));
            

            document.getElementById("useName").value = "";
            document.getElementById("amount").value = "";
            
        };
        var savedBudget = localStorage.getItem("budget");
        if (savedBudget != null){
            document.getElementById("budget").value = savedBudget;           
        }

        var saved = localStorage.getItem("expenses");
        if (saved != null){
            expenses = JSON.parse(saved);

            for(var i=0; i < expenses.length; i++){
                showExpense(expenses[i].name, expenses[i].amount, expenses[i].category);
            }
        }
        </script>   

    </body>

</html>
