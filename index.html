<!DOCTYPE html>
<html>
    <head>
        <title> My Expense Tracker </title>

        <style>
            body{
                font-family: Arial;
                margin: 0;
            }

            h1{
                background-color: black;
                color: white;
                padding: 15px;
                margin: 0;
            }

            #sidebar{
                width: 250px;
                background-color: lightgray;
                padding: 20px;
                float: left;
                height: 100vh;
            }

            #main{
                margin-left: 300px;
                padding: 20px;
            }

        </style>
    </head>
    <body>

        <h1> Expense Tracker</h>
        <div id="sidebar">
            <h2>Add expense</h2>
            <p>What did you spend on ??</p>
            <input type="text" id="useName">

            <p>How much?</p>
            <input type="number" id="amount">

            <p> Category</p>
            <select id="category">
                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
                <option>Other</option>
            </select>

            <br><br>
            <button id="addBtn">Add</button>
        </div>
        <div id="main">
            <h2>This month</h2>
        </div>    

    </body>

</html>
