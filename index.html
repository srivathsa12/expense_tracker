<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pocket - Student Expense Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
    <header class="topbar">
        <a href="#" class="logo" aria-label="Pocket home">
            <span class="logo-mark"></span>
            Pocket
        </a>

        <nav class="pill-nav">
            <a href="#top" class="active">Dashboard</a>
            <a href="#recent">Expenses</a>
            <a href="#categories">Categories</a>
            <a href="#goals">Goals</a>
        </nav>

        <div class="top-right">
            <button class="round-btn" id="streakBtn" aria-label="Your streak">
                <i data-lucide="flame"></i>
                <span class="ping" id="ping"></span>
            </button>
            <span class="avatar">S</span>
        </div>
    </header>
    <section class="welcome" id="top">
        <div>
            <p class="welcome-sub" id="subtitle">Take control of your pocket money, one day at a time</p>
            <h1 id="greeting">Welcome Back, Srivathsa!</h1>
        </div>
        <button class="btn-black" id="openAdd"><i data-lucide="plus"></i> Add Expense</button>
    </section>

    <section class="hero-row">
        <div class="hero reveal" style="--i:0">
            <div class="hero-head">
                <h2>This Month</h2>
                <div class="glass-seg">
                    <button class="active" id="segMonth">Month</button>
                    <button id="segWeek">Week</button>
                </div>
            </div>

            <p class="big-num" id="monthTotal">Rs 0<span class="dec">.00</span></p>
            <span class="glass-pill" id="monthTrend"><i data-lucide="arrow-up-right"></i> 0% vs last month</span>

            <div class="chart">
                <div class="y-labels" id="yLabels"></div>
                <div class="bars-wrap">
                    <div class="bars" id="bars">
                        <div class="bar" style="--h:40%"><span style="height: 40%"></span></div>
                        <div class="bar" style="--h:75%"><span style="height:75%"></span></div>
                        <div class="bar" style="--h:20%"><span style="height:20%"></span></div>
                        <div class="bar today" style="--h:55%"><span style="height:55%"></span></div>
                        <div class="bar future" style="--h:8%"><span style="height:8%"></span></div>
                    </div>
                    <div class="tooltip" id="tooltip">
                        <p><b id="tipAmount">Rs 0</b> <span class="tip-tag" id="tipTag">Food</span></p>
                        <p class="tip-date" id="tipDate">25 November</p>
                    </div>
                </div>
            </div>
            <div class="x-labels" id="xLabels"></div>
        </div>

        <div class="hero hero-side reveal" style="--i:1">
            <div class="hero-head">
                <h2>Safe to Spend Today</h2>
                <button class="glass-round" id="editBudget" aria-label="Edit budget"><i data-lucide="pencil"></i></button>
            </div>

            <p class="big-num" id="safeToday">Rs 0<span class="dec">.00</span></p>
            <div class="pill-row">
                <span class="glass-pill" id="daysLeft"><i data-lucide="calendar"></i> 0 days left</span>
                <span class="glass-pill" id="budgetPill"><i data-lucide="wallet"></i> Budget: Rs 0</span>

            </div>

            <div class="action-row">
                <button class="btn-white" id="openAdd2"><i data-lucide="arrow-up-right"></i> Add Expense</button>
                <button class="btn-white-round" id="swapBtn" aria-label="Switch chart view"><i data-lucide="arrow-down-up"></i></button>
                <button class="btn-white" id="noSpendBtn"><i data-lucide="leaf"></i> No-spend Day</button>
            </div>
        </div>
    </section>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="script.js"></script>
</body>

</html>
